<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger architecture and order placement</title><desc id="desc">Browser UI, Express routes, all ten library modules, configuration, and persisted checkout flow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#137b69"/></marker></defs>
<style>text{font-family:system-ui,sans-serif}.title{font-size:39px;font-weight:750;fill:#102c37}.sub{font-size:16px;fill:#435f67}.section{font-size:13px;font-weight:750;letter-spacing:1.5px;fill:#176658}.name{font-size:16px;font-weight:700;fill:#133742}.body{font-size:13px;fill:#435f67}.card{stroke:#bed0d0;fill:#fff}.hot{stroke:#4b9a87;fill:#edf9f4}.flow{stroke:#137b69;stroke-width:2;fill:none}.step{font-size:14px;font-weight:700;fill:#15413b}.tag{font-size:13px;fill:#357465}</style>
<rect width="1200" height="820" fill="#f5f9f8"/>
<rect x="0" y="0" width="1200" height="8" fill="#137b69"/>
<text x="40" y="61" class="title">ShopLedger architecture</text>
<text x="41" y="88" class="sub">Legacy workshop baseline · Browser, Express, business logic, and JSON storage</text>
<text x="40" y="129" class="section">BROWSER AND SERVER</text>
<rect x="40" y="143" width="350" height="66" rx="11" class="hot"/><text x="55" y="171" class="name">public/index.html + public/js/app.js</text><text x="55" y="192" class="body">POS, order history, Khata, and GST audit</text>
<path d="M390 176 L421 176" class="flow" marker-end="url(#arrow)"/>
<rect x="425" y="143" width="350" height="66" rx="11" class="card"/><text x="440" y="171" class="name">server.js</text><text x="440" y="192" class="body">Serves static UI, mounts /api and invoice route</text>
<rect x="810" y="143" width="350" height="66" rx="11" class="card"/><text x="825" y="171" class="name">config.js</text><text x="825" y="192" class="body">Shop identity, port, HSN, coupon, stock settings</text>
<text x="40" y="242" class="section">API ROUTERS  /  routes/</text>
<rect x="40" y="255" width="265" height="65" rx="11" class="card"/><text x="55" y="283" class="name">products.js</text><text x="55" y="304" class="body">Catalog, stock and coupons</text>
<rect x="325" y="255" width="265" height="65" rx="11" class="hot"/><text x="340" y="283" class="name">orders.js</text><text x="340" y="304" class="body">Checkout, history and cancellation</text>
<rect x="610" y="255" width="265" height="65" rx="11" class="card"/><text x="625" y="283" class="name">customers.js</text><text x="625" y="304" class="body">Khata accounts and settlements</text>
<rect x="895" y="255" width="265" height="65" rx="11" class="card"/><text x="910" y="283" class="name">reports.js</text><text x="910" y="304" class="body">Preview, dashboard and GST audit</text>
<text x="40" y="353" class="section">BUSINESS LOGIC AND STORAGE  /  lib/</text>
<rect x="40" y="367" width="216" height="62" rx="11" class="hot"/><text x="55" y="395" class="name">inventory.js</text><text x="55" y="416" class="body">Checks and deducts stock</text><rect x="266" y="367" width="216" height="62" rx="11" class="hot"/><text x="281" y="395" class="name">coupons.js</text><text x="281" y="416" class="body">Validates code and applies caps</text><rect x="492" y="367" width="216" height="62" rx="11" class="hot"/><text x="507" y="395" class="name">pricing.js</text><text x="507" y="416" class="body">Calculates checkout totals</text><rect x="718" y="367" width="216" height="62" rx="11" class="hot"/><text x="733" y="395" class="name">tax.js</text><text x="733" y="416" class="body">HSN rates and GST split</text><rect x="944" y="367" width="216" height="62" rx="11" class="hot"/><text x="959" y="395" class="name">ledger.js</text><text x="959" y="416" class="body">Posts and reverses Khata</text><rect x="40" y="445" width="216" height="62" rx="11" class="hot"/><text x="55" y="473" class="name">orders.js</text><text x="55" y="494" class="body">Order lifecycle and lookup</text><rect x="266" y="445" width="216" height="62" rx="11" class="card"/><text x="281" y="473" class="name">dates.js</text><text x="281" y="494" class="body">Formats and filters order dates</text><rect x="492" y="445" width="216" height="62" rx="11" class="card"/><text x="507" y="473" class="name">invoice.js</text><text x="507" y="494" class="body">Computes and prints invoices</text><rect x="718" y="445" width="216" height="62" rx="11" class="card"/><text x="733" y="473" class="name">reports.js</text><text x="733" y="494" class="body">Dashboard and reconciliation</text><rect x="944" y="445" width="216" height="62" rx="11" class="hot"/><text x="959" y="473" class="name">store.js</text><text x="959" y="494" class="body">JSON reads, writes and audit</text>
<rect x="40" y="528" width="350" height="65" rx="11" class="hot"/><text x="55" y="556" class="name">data/db.json</text><text x="55" y="577" class="body">Products, orders, credit balances, and audit</text>
<path d="M400 560 L355 560" class="flow" marker-end="url(#arrow)"/><text x="418" y="565" class="tag">lib/store.js reads and writes the working database.</text><text x="40" y="633" class="section">ORDER PLACEMENT  /  POST /api/orders</text>
<rect x="40" y="649" width="208" height="76" rx="11" class="hot"/><text x="54" y="675" class="step">1  Resolve cart</text><text x="54" y="702" class="body">Read store and check stock</text><path d="M248 688 L264 688" class="flow" marker-end="url(#arrow)"/><rect x="266" y="649" width="208" height="76" rx="11" class="hot"/><text x="280" y="675" class="step">2  Price order</text><text x="280" y="702" class="body">Apply coupon and GST</text><path d="M474 688 L490 688" class="flow" marker-end="url(#arrow)"/><rect x="492" y="649" width="208" height="76" rx="11" class="hot"/><text x="506" y="675" class="step">3  Apply changes</text><text x="506" y="702" class="body">Charge Khata if selected</text><path d="M700 688 L716 688" class="flow" marker-end="url(#arrow)"/><rect x="718" y="649" width="208" height="76" rx="11" class="hot"/><text x="732" y="675" class="step">4  Record sale</text><text x="732" y="702" class="body">Stock, order and audit entry</text><path d="M926 688 L942 688" class="flow" marker-end="url(#arrow)"/><rect x="944" y="649" width="208" height="76" rx="11" class="hot"/><text x="958" y="675" class="step">5  Save and respond</text><text x="958" y="702" class="body">Write JSON and return 201</text>
<text x="40" y="773" class="tag">Green marks entry points and modules used to place an order. The invoice view and GST audit both call lib/invoice.js.</text>
</svg>
